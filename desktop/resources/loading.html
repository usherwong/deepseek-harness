<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #1c1f24;
        --muted: #646b76;
        --card: #ffffff;
        --line: #e2e5ea;
        --accent: #3b6ef2;
        --danger: #c0392b;
        --code-bg: #f0f2f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111318;
          --fg: #e8eaed;
          --muted: #939aa6;
          --card: #191c22;
          --line: #2a2e37;
          --accent: #6f96ff;
          --danger: #ff7b6b;
          --code-bg: #0d0f13;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 24px;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(720px, 100%); }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .mark {
        width: 40px; height: 40px; border-radius: 11px; flex: none;
        background: linear-gradient(160deg, #5a78ff, #3d57e0);
        display: grid; place-items: center;
        color: #fff;
      }
      .mark svg { width: 25px; height: 25px; display: block; }
      h1 { margin: 0; font-size: 17px; font-weight: 600; }
      .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
      .card {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 14px; padding: 22px;
      }
      .row { display: flex; align-items: center; gap: 12px; }
      .spinner {
        width: 16px; height: 16px; flex: none; border-radius: 50%;
        border: 2px solid var(--line); border-top-color: var(--accent);
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .dot { width: 10px; height: 10px; flex: none; border-radius: 50%; background: var(--danger); }
      #message { font-weight: 550; }
      #detail { margin: 10px 0 0; color: var(--muted); font-size: 12.5px; word-break: break-word; }
      pre {
        margin: 16px 0 0; padding: 12px 14px; max-height: 210px; overflow: auto;
        background: var(--code-bg); border: 1px solid var(--line); border-radius: 9px;
        font: 11.5px/1.5 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        color: var(--muted); white-space: pre-wrap; -webkit-user-select: text; user-select: text;
      }
      pre:empty { display: none; }
      .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      .actions:empty { display: none; }
      button {
        font: inherit; font-size: 13px; padding: 7px 15px; border-radius: 8px;
        border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.primary:hover { opacity: .9; color: #fff; }
      footer { margin-top: 16px; color: var(--muted); font-size: 11.5px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 27 23" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

          </svg>
        </div>
        <div>
          <h1>DeepSeek Harness</h1>
          <p>Desktop shell</p>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div class="spinner" id="indicator"></div>
          <div id="message">Starting DeepSeek Harness…</div>
        </div>
        <p id="detail"></p>
        <pre id="log"></pre>
        <div class="actions" id="actions"></div>
      </div>

      <footer id="footer"></footer>
    </main>

    <script>
      const indicator = document.getElementById('indicator')
      const message = document.getElementById('message')
      const detail = document.getElementById('detail')
      const log = document.getElementById('log')
      const actions = document.getElementById('actions')
      const footer = document.getElementById('footer')

      const lines = []

      function appendLine(line) {
        lines.push(line)
        if (lines.length > 200) lines.shift()
        log.textContent = lines.join('\n')
        log.scrollTop = log.scrollHeight
      }

      function button(label, handler, primary) {
        const element = document.createElement('button')
        element.textContent = label
        if (primary === true) element.className = 'primary'
        element.addEventListener('click', handler)
        return element
      }

      function showFailure(payload) {
        indicator.className = 'dot'
        message.textContent = payload.message
        detail.textContent = 'The harness could not start. The last output is below.'
        if (typeof payload.detail === 'string' && payload.detail.length > 0) {
          log.textContent = payload.detail
          log.scrollTop = log.scrollHeight
        }
        actions.replaceChildren(
          button('Retry', () => window.dshDesktop.retry(), true),
          button('Change workspace folder…', () => window.dshDesktop.chooseWorkspace()),
          button('Open logs', () => window.dshDesktop.openLogs()),
        )
      }

      window.dshDesktop.onStatus(payload => {
        if (payload.phase === 'log') {
          appendLine(payload.line)
          return
        }
        if (payload.phase === 'failed') {
          showFailure(payload)
          return
        }
        indicator.className = 'spinner'
        actions.replaceChildren()
        message.textContent = payload.message
        detail.textContent = payload.detail ?? ''
      })

      window.dshDesktop.info().then(info => {
        footer.textContent = [
          'harness ' + info.harnessVersion + ' (' + info.harnessMode + ')',
          info.nodeVersion === null ? null : 'node ' + info.nodeVersion,
          'workspace ' + info.workspaceRoot,
        ].filter(entry => entry !== null).join('  ·  ')
      })
    </script>
  </body>
</html>
